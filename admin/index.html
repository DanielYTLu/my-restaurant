<!DOCTYPE html>
<html lang='zh-TW'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>黑白呷 Admin 後台</title>
    <script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
    <link rel='stylesheet' href='admin.css'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body>
    <div class='container-fluid px-0' id='app'>
        <section id='login-section' class='d-flex align-items-center justify-content-center vh-100'>
            <div class='card p-4 shadow-lg' style='max-width: 400px; width: 100%;'>
                <h2 class='card-title text-center mb-4'>Admin 登入</h2>
                <div id='login-error' class='alert alert-danger d-none'></div>
                <form id='login-form'>
                    <div class='mb-3'>
                        <label for='email' class='form-label'>Email</label>
                        <input type='email' class='form-control' id='email' required>
                    </div>
                    <div class='mb-3'>
                        <label for='password' class='form-label'>密碼</label>
                        <input type='password' class='form-control' id='password' required>
                    </div>
                    <button type='submit' class='btn btn-primary w-100'>登入</button>
                </form>
            </div>
        </section>

        <section id='dashboard-section' class='d-none'>
            <nav class='navbar navbar-expand navbar-dark bg-dark px-3 shadow-sm'>
                <div class='container-fluid px-0'>
                    <a class='navbar-brand fw-bold' href='#'>黑白呷 Admin 後台</a>
                    <ul class='navbar-nav me-auto mb-0'>
                        <li class='nav-item'>
                            <a class='nav-link active px-3' aria-current='page' href='#' data-panel='overview'>總覽</a>
                        </li>
                        <li class='nav-item'>
                            <a class='nav-link px-3' href='#' data-panel='users'>使用者管理</a>
                        </li>
                        <li class='nav-item'>
                            <a class='nav-link px-3' href='#' data-panel='restaurants'>餐廳管理</a>
                        </li>
                        <li class='nav-item'>
                            <a class='nav-link px-3' href='#' data-panel='groups'>群組管理</a>
                        </li>
                        <li class='nav-item'>
                            <a class='nav-link px-3' href='#' data-panel='announcements'>公告管理</a>
                        </li>
                    </ul>
                    <div class='d-flex align-items-center'>
                        <span class='navbar-text text-light me-3 small' id='admin-user-email'></span>
                        <button class='btn btn-outline-light btn-sm' id='logout-button'>登出</button>
                    </div>
                </div>
            </nav>

            <div class='container my-4'>
                <div id='overview-panel' class='admin-panel'>
                    <h2 class='mb-4'>總覽儀表板</h2>
                    <div class='row g-4 mb-4' id='stats-cards-row'>
                        <div class='col-md-3'>
                            <div class='stat-card'>
                                <div class='card-title'>總餐廳數</div>
                                <div class='card-text' id='stat-restaurants'>-</div>
                            </div>
                        </div>
                        <div class='col-md-3'>
                            <div class='stat-card'>
                                <div class='card-title'>總會員數</div>
                                <div class='card-text' id='stat-users'>-</div>
                            </div>
                        </div>
                        <div class='col-md-3'>
                            <div class='stat-card'>
                                <div class='card-title'>總群組數</div>
                                <div class='card-text' id='stat-groups'>-</div>
                            </div>
                        </div>
                        <div class='col-md-3'>
                            <div class='stat-card'>
                                <div class='card-title'>公告數</div>
                                <div class='card-text' id='stat-announcements'>-</div>
                            </div>
                        </div>
<!-- Remove old cards -->
                    </div>
                    <div class='p-4 bg-light rounded-3'>
                        <h4>歡迎來到黑白呷管理後台！</h4>
                        <p class='text-muted mb-0'>您可以使用上方導覽列隨時切換至各管理面板進行維護。</p>
                    </div>
                </div>

                <div id='users-panel' class='admin-panel d-none'>
                    <div class='d-flex justify-content-between align-items-center mb-3'>
                        <h2 class='mb-0'>使用者管理</h2>
                        <div class='d-flex gap-2'>
                            <input type='text' id='user-search-input' class='form-control form-control-sm' placeholder='搜尋 Email...'>
                            <select id='user-role-filter' class='form-select form-select-sm'>
                                <option value=''>全部角色</option>
                                <option value='user'>user</option>
                                <option value='admin'>admin</option>
                                <option value='developer'>developer</option>
                            </select>
                        </div>
                    </div>
                    <div class='table-responsive'>
                        <table class='table table-striped align-middle'>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Email</th>
                                    <th>角色</th>
                                    <th>狀態</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id='users-table-body'></tbody>
                        </table>
                    </div>
                </div>

                <div id='restaurants-panel' class='admin-panel d-none'>
                    <div class='d-flex justify-content-between align-items-center mb-3'>
                        <h2 class='mb-0'>餐廳管理</h2>
                    </div>
                    <input type='text' id='restaurant-search-input' class='form-control mb-3' placeholder='搜尋餐廳名稱...'>
                    <div class='table-responsive'>
                        <table class='table table-striped align-middle'>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名稱</th>
                                    <th>類別</th>
                                    <th>地址</th>
                                    <th>評分</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id='restaurants-table-body'></tbody>
                        </table>
                    </div>
                </div>

                <div id='groups-panel' class='admin-panel d-none'>
                    <h2 class='mb-3'>群組管理</h2>
                    <div class='table-responsive'>
                        <table class='table table-striped align-middle'>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名稱</th>
                                    <th>可見性</th>
                                    <th>使用者ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id='groups-table-body'></tbody>
                        </table>
                    </div>
                </div>

                <div id='announcements-panel' class='admin-panel d-none'>
                    <div class='d-flex justify-content-between align-items-center mb-3'>
                        <h2 class='mb-0'>公告管理</h2>
                        <button class='btn btn-success' id='open-announcement-modal-btn'>新增公告</button>
                    </div>
                    <div class='table-responsive'>
                        <table class='table table-striped align-middle'>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>標題</th>
                                    <th>類型</th>
                                    <th>釘選</th>
                                    <th>發布</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id='announcements-table-body'></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Announcement Modal -->
    <div class='modal fade' id='announcementModal' tabindex='-1' aria-hidden='true'>
        <div class='modal-dialog'>
            <div class='modal-content'>
                <div class='modal-header'>
                    <h5 class='modal-title' id='announcementModalTitle'>新增公告</h5>
                    <button type='button' class='btn-close' data-bs-dismiss='modal' aria-label='Close'></button>
                </div>
                <div class='modal-body'>
                    <form id='announcement-form'>
                        <input type='hidden' id='announcement-id'>
                        <div class='mb-3'>
                            <label for='announcement-title' class='form-label'>標題</label>
                            <input type='text' class='form-control' id='announcement-title' required>
                        </div>
                        <div class='mb-3'>
                            <label for='announcement-type' class='form-label'>類型</label>
                            <select class='form-select' id='announcement-type'>
                                <option value='info'>info</option>
                                <option value='update'>update</option>
                                <option value='event'>event</option>
                            </select>
                        </div>
                        <div class='mb-3'>
                            <label for='announcement-content' class='form-label'>內容</label>
                            <textarea class='form-control' id='announcement-content' rows='4' required></textarea>
                        </div>
                        <div class='mb-3 form-check'>
                            <input type='checkbox' class='form-check-input' id='announcement-pinned'>
                            <label class='form-check-label' for='announcement-pinned'>置頂釘選 (is_pinned)</label>
                        </div>
                        <div class='mb-3 form-check'>
                            <input type='checkbox' class='form-check-input' id='announcement-published' checked>
                            <label class='form-check-label' for='announcement-published'>立即發布 (is_published)</label>
                        </div>
                    </form>
                </div>
                <div class='modal-footer'>
                    <button type='button' class='btn btn-secondary' data-bs-dismiss='modal'>取消</button>
                    <button type='button' class='btn btn-primary' id='save-announcement-btn'>儲存公告</button>
                </div>
            </div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
    <script src='admin.js'></script>
</body>
</html>
