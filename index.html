<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f7f5"
    >

    <script>
        (() => {
            const theme = localStorage.getItem("theme") || "system";
            const isDark = theme === "dark" || (
                theme === "system" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            );

            document.documentElement.dataset.theme = isDark ? "dark" : "light";

            if (
                window.matchMedia("(display-mode: standalone)").matches ||
                window.navigator.standalone === true
            ) {
                document.documentElement.classList.add("app-standalone");
            }
        })();
    </script>

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="好店簿"
    >

    <title>好店簿</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/icon-180.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icons/icon-180.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div
        id="appSplash"
        class="app-splash"
        aria-label="好店簿 載入中"
    >
        <img src="./icons/icon-180.png" alt="">
        <span>好店簿</span>
    </div>


    <!-- ==================================================
         Header
    =================================================== -->

    <header class="app-header">

        <div class="header-inner">

            <div>

                <p class="eyebrow">
                    MY RESTAURANTS
                </p>

                <h1>
                    我的餐廳
                </h1>

            </div>

            <button
                id="displaySettingsButton"
                class="display-settings-button"
                type="button"
                aria-label="顯示與排序"
                title="顯示與排序"
            >
                ⚙️
            </button>

        </div>

    </header>



    <!-- ==================================================
         Main
    =================================================== -->

    <main class="app-main">


        <!-- ==================================================
             Search
        =================================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="搜尋餐廳、分類或地點..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="clearSearchButton"
                    class="clear-search-button"
                    aria-label="清除搜尋"
                    hidden
                >
                    ×
                </button>

            </div>

        </section>



        <!-- ==================================================
             Categories
        =================================================== -->

        <section class="category-section">

            <div class="category-scroll">


                <!-- 全部 -->

                <button
                    class="category active"
                    data-category="全部"
                    type="button"
                >

                    <span class="category-icon">
                        🍽️
                    </span>

                    <span>
                        全部
                    </span>

                </button>



                <!-- 收藏 -->

                <button
                    class="category"
                    data-category="收藏"
                    type="button"
                >

                    <span class="category-icon">
                        ❤️
                    </span>

                    <span>
                        收藏
                    </span>

                </button>



                <!-- 火鍋 -->

                <button
                    class="category"
                    data-category="火鍋"
                    type="button"
                >

                    <span class="category-icon">
                        🍲
                    </span>

                    <span>
                        火鍋
                    </span>

                </button>



                <!-- 燒肉 -->

                <button
                    class="category"
                    data-category="燒肉"
                    type="button"
                >

                    <span class="category-icon">
                        🥩
                    </span>

                    <span>
                        燒肉
                    </span>

                </button>



                <!-- 咖啡 -->

                <button
                    class="category"
                    data-category="咖啡"
                    type="button"
                >

                    <span class="category-icon">
                        ☕
                    </span>

                    <span>
                        咖啡
                    </span>

                </button>



                <!-- 義式 -->

                <button
                    class="category"
                    data-category="義式"
                    type="button"
                >

                    <span class="category-icon">
                        🍝
                    </span>

                    <span>
                        義式
                    </span>

                </button>



                <!-- 中式 -->

                <button
                    class="category"
                    data-category="中式"
                    type="button"
                >

                    <span class="category-icon">
                        🥢
                    </span>

                    <span>
                        中式
                    </span>

                </button>



                <!-- 日式 -->

                <button
                    class="category"
                    data-category="日式"
                    type="button"
                >

                    <span class="category-icon">
                        🍣
                    </span>

                    <span>
                        日式
                    </span>

                </button>



                <!-- 其他 -->

                <button
                    class="category"
                    data-category="其他"
                    type="button"
                >

                    <span class="category-icon">
                        ✨
                    </span>

                    <span>
                        其他
                    </span>

                </button>


            </div>

        </section>



        <!-- ==================================================
             Restaurant List
        =================================================== -->

        <section
            id="restaurantList"
            class="restaurant-list"
        ></section>


    </main>


    <div id="displaySettingsModal" class="modal-overlay">

        <div class="display-settings-sheet">

            <div class="modal-header">
                <div>
                    <p class="eyebrow">DISPLAY</p>
                    <h2>顯示與排序</h2>
                </div>
                <button id="closeDisplaySettings" class="modal-close" type="button">×</button>
            </div>

            <div class="display-settings-content">

                <section class="display-setting-section">
                    <h3>文字大小</h3>
                    <div class="settings-segmented" id="fontSizeOptions">
                        <button type="button" data-font-size="extra-small">A−−</button>
                        <button type="button" data-font-size="small">A−</button>
                        <button type="button" data-font-size="medium">標準</button>
                        <button type="button" data-font-size="large">A＋</button>
                        <button type="button" data-font-size="extra-large">A＋＋</button>
                    </div>
                </section>

                <section class="display-setting-section">
                    <h3>瀏覽方式</h3>
                    <div class="settings-segmented" id="viewModeOptions">
                        <button type="button" data-view-mode="card">▦ 卡片</button>
                        <button type="button" data-view-mode="list">☰ 列表</button>
                    </div>
                </section>

                <section class="display-setting-section">
                    <h3>外觀</h3>
                    <div class="settings-segmented" id="themeOptions">
                        <button type="button" data-theme-mode="light">☀️ 淺色</button>
                        <button type="button" data-theme-mode="dark">🌙 深色</button>
                        <button type="button" data-theme-mode="system">⚙️ 系統</button>
                    </div>
                </section>

                <button id="editOrderButton" class="settings-row-button" type="button">
                    <span>↕️ 編輯卡片順序</span>
                    <span>›</span>
                </button>

            </div>

        </div>

    </div>


    <div id="orderSettingsModal" class="modal-overlay">

        <div class="display-settings-sheet order-sheet">

            <div class="modal-header">
                <div>
                    <p class="eyebrow">ORDER</p>
                    <h2>編輯卡片順序</h2>
                </div>
                <button id="finishOrderButton" class="settings-finish-button" type="button">完成</button>
            </div>

            <div id="orderList" class="order-list"></div>

        </div>

    </div>



    <!-- ==================================================
         Add Restaurant Button
    =================================================== -->

    <button
        id="addRestaurantButton"
        class="floating-add-button"
        type="button"
        aria-label="新增餐廳"
    >

        <span>
            +
        </span>

    </button>



    <!-- ==================================================
         Add / Edit Restaurant Modal
    =================================================== -->

    <div
        id="restaurantModal"
        class="modal-overlay"
    >

        <div class="restaurant-modal">


            <!-- ==================================================
                 Modal Header
            =================================================== -->

            <div class="modal-header">

                <div>

                    <p class="eyebrow">
                        RESTAURANT
                    </p>

                    <h2>
                        新增餐廳
                    </h2>

                </div>


                <button
                    id="closeModal"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>



            <!-- ==================================================
                 Form
            =================================================== -->

            <form
                id="restaurantForm"
                class="restaurant-form"
            >


                <!-- ==================================================
                     01 Basic Information
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                01
                            </span>

                            <h3>
                                基本資訊
                            </h3>

                        </div>

                    </div>



                    <!-- Name -->

                    <label class="form-field">

                        <span>
                            餐廳名稱
                        </span>

                        <input
                            type="text"
                            id="restaurantName"
                            placeholder="例如：山海鍋物"
                            required
                        >

                    </label>



                    <!-- Category -->

                    <label class="form-field">

                        <span>
                            餐廳分類
                        </span>

                        <select
                            id="restaurantCategory"
                            required
                        >

                            <option value="">
                                請選擇分類
                            </option>

                            <option value="火鍋">
                                火鍋
                            </option>

                            <option value="燒肉">
                                燒肉
                            </option>

                            <option value="咖啡">
                                咖啡
                            </option>

                            <option value="義式">
                                義式
                            </option>

                            <option value="中式">
                                中式
                            </option>

                            <option value="日式">
                                日式
                            </option>

                            <option value="其他">
                                其他
                            </option>

                        </select>

                    </label>



                    <!-- Rating -->

                    <label class="form-field">

                        <span>
                            Google 評分
                        </span>

                        <input
                            type="number"
                            id="restaurantRating"
                            placeholder="例如：4.8"
                            min="0"
                            max="5"
                            step="0.1"
                        >

                    </label>
                    <!-- Restaurant Image -->
                    <div class="menu-form-item restaurant-image-form-item">
                        <div class="menu-form-label">
                            <span>
                                餐廳圖片
                            </span>
                            <button
                                type="button"
                                class="menu-remove-button"
                                id="restaurantImageRemove"
                            >
                                移除
                            </button>
                        </div>
                        <div
                            class="menu-preview"
                            id="restaurantImagePreview"
                        >
                            <div class="menu-preview-empty">
                                <span class="menu-upload-icon">
                                    🏪
                                </span>
                                <p>
                                    點擊上傳餐廳圖片
                                </p>
                            </div>
                        </div>
                        <input
                            type="file"
                            id="restaurantImage"
                            accept="image/*"
                        >
                    </div>

                </div>



                <!-- ==================================================
                     02 Contact
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                02
                            </span>

                            <h3>
                                聯絡資訊
                            </h3>

                        </div>

                    </div>



                    <!-- Phone -->

                    <label class="form-field">

                        <span>
                            電話
                        </span>

                        <input
                            type="tel"
                            id="restaurantPhone"
                            placeholder="例如：02-1234-5678"
                        >

                    </label>



                    <!-- Address -->

                    <label class="form-field">

                        <span>
                            地址
                        </span>

                        <input
                            type="text"
                            id="restaurantAddress"
                            placeholder="例如：台北市大安區..."
                        >

                    </label>



                    <!-- Hours -->

                    <div class="form-field hours-editor">

                        <span>
                            營業時間
                        </span>

                        <div id="weeklyHoursEditor"></div>

                        <div class="hours-quick-apply">

                            <strong>
                                快速套用相同營業時間
                            </strong>

                            <div class="hours-day-picker" id="quickHoursDays"></div>

                            <div class="hours-quick-times">

                                <input type="time" id="quickHoursStart" value="11:00">
                                <span>～</span>
                                <input type="time" id="quickHoursEnd" value="20:00">

                            </div>

                            <button type="button" id="applyQuickHours">
                                套用到選取日期
                            </button>

                        </div>

                    </div>

                </div>



                <!-- ==================================================
                     03 Google Maps
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                03
                            </span>

                            <h3>
                                Google Maps
                            </h3>

                        </div>

                    </div>


                    <label class="form-field">

                        <span>
                            Google Maps 網址
                        </span>

                        <input
                            type="url"
                            id="restaurantMaps"
                            placeholder="https://maps.google.com/..."
                        >

                    </label>

                </div>



                <!-- ==================================================
                     04 Menu Images
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                04
                            </span>

                            <h3>
                                菜單圖片
                            </h3>

                        </div>


                        <span class="form-section-hint">
                            最多 3 張
                        </span>

                    </div>


                    <p class="form-description">

                        菜單是這個系統最重要的功能。
                        請貼上可以直接開啟圖片的網址，
                        輸入後會立即顯示預覽。

                    </p>



                    <!-- Menu 1 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 01
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="1"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview1"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="file"
                            id="restaurantMenu1"
                            accept="image/*"
                        >

                    </div>



                    <!-- Menu 2 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 02
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="2"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview2"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="file"
                            id="restaurantMenu2"
                            accept="image/*"
                        >

                    </div>



                    <!-- Menu 3 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 03
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="3"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview3"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="file"
                            id="restaurantMenu3"
                            accept="image/*"
                        >

                    </div>

                </div>



                <!-- ==================================================
                     05 Description / Notes
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                05
                            </span>

                            <h3>
                                我的備註
                            </h3>

                        </div>

                    </div>


                    <label class="form-field">

                        <span>
                            備註
                        </span>

                        <textarea
                            id="restaurantDescription"
                            rows="4"
                            placeholder="例如：推薦牛肉鍋、適合朋友聚餐..."
                        ></textarea>

                    </label>

                </div>



                <!-- ==================================================
                     Submit
                =================================================== -->

                <button
                    type="submit"
                    class="form-submit-button"
                >

                    儲存餐廳

                </button>


            </form>

        </div>

    </div>



    <!-- ==================================================
         JavaScript
    =================================================== -->

    <!-- Supabase JS v2 -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Project JavaScript -->

    <script
        src="script.js"
    ></script>


</body>

</html>
