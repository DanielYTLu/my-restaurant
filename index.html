<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f7f5"
    >

    <title>My Restaurants</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         Header
    =================================================== -->

    <header class="app-header">

        <div class="header-inner">

            <div>

                <p class="eyebrow">
                    MY RESTAURANTS
                </p>

                <h1>
                    我的餐廳
                </h1>

            </div>

        </div>

    </header>



    <!-- ==================================================
         Main
    =================================================== -->

    <main class="app-main">


        <!-- ==================================================
             Search
        =================================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="搜尋餐廳、分類或地點..."
                    autocomplete="off"
                >

            </div>

        </section>



        <!-- ==================================================
             Categories
        =================================================== -->

        <section class="category-section">

            <div class="category-scroll">

                <button
                    class="category active"
                    data-category="全部"
                >
                    全部
                </button>

                <button
                    class="category"
                    data-category="火鍋"
                >
                    火鍋
                </button>

                <button
                    class="category"
                    data-category="燒肉"
                >
                    燒肉
                </button>

                <button
                    class="category"
                    data-category="咖啡"
                >
                    咖啡
                </button>

                <button
                    class="category"
                    data-category="義式"
                >
                    義式
                </button>

                <button
                    class="category"
                    data-category="中式"
                >
                    中式
                </button>

                <button
                    class="category"
                    data-category="日式"
                >
                    日式
                </button>

                <button
                    class="category"
                    data-category="其他"
                >
                    其他
                </button>

            </div>

        </section>



        <!-- ==================================================
             Restaurant List
        =================================================== -->

        <section
            id="restaurantList"
            class="restaurant-list"
        ></section>


    </main>



    <!-- ==================================================
         Add Restaurant Button
    =================================================== -->

    <button
        id="addRestaurantButton"
        class="floating-add-button"
        aria-label="新增餐廳"
    >

        <span>
            +
        </span>

    </button>



    <!-- ==================================================
         Add / Edit Restaurant Modal
    =================================================== -->

    <div
        id="restaurantModal"
        class="modal-overlay"
    >

        <div class="restaurant-modal">


            <!-- Modal Header -->

            <div class="modal-header">

                <div>

                    <p class="eyebrow">
                        RESTAURANT
                    </p>

                    <h2>
                        新增餐廳
                    </h2>

                </div>


                <button
                    id="closeModal"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>



            <!-- Form -->

            <form
                id="restaurantForm"
                class="restaurant-form"
            >


                <!-- ==================================================
                     Basic Information
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                01
                            </span>

                            <h3>
                                基本資訊
                            </h3>

                        </div>

                    </div>


                    <!-- Name -->

                    <label class="form-field">

                        <span>
                            餐廳名稱
                        </span>

                        <input
                            type="text"
                            id="restaurantName"
                            placeholder="例如：山海鍋物"
                            required
                        >

                    </label>



                    <!-- Category -->

                    <label class="form-field">

                        <span>
                            餐廳分類
                        </span>

                        <select
                            id="restaurantCategory"
                            required
                        >

                            <option value="">
                                請選擇分類
                            </option>

                            <option value="火鍋">
                                火鍋
                            </option>

                            <option value="燒肉">
                                燒肉
                            </option>

                            <option value="咖啡">
                                咖啡
                            </option>

                            <option value="義式">
                                義式
                            </option>

                            <option value="中式">
                                中式
                            </option>

                            <option value="日式">
                                日式
                            </option>

                            <option value="其他">
                                其他
                            </option>

                        </select>

                    </label>



                    <!-- Rating -->

                    <label class="form-field">

                        <span>
                            Google 評分
                        </span>

                        <input
                            type="number"
                            id="restaurantRating"
                            placeholder="例如：4.8"
                            min="0"
                            max="5"
                            step="0.1"
                        >

                    </label>

                </div>



                <!-- ==================================================
                     Restaurant Image
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                02
                            </span>

                            <h3>
                                餐廳照片
                            </h3>

                        </div>

                    </div>


                    <p class="form-description">

                        請貼上餐廳封面圖片網址。

                    </p>


                    <label class="form-field">

                        <span>
                            圖片網址
                        </span>

                        <input
                            type="url"
                            id="restaurantImage"
                            placeholder="https://..."
                        >

                    </label>

                </div>



                <!-- ==================================================
                     Contact
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                03
                            </span>

                            <h3>
                                聯絡資訊
                            </h3>

                        </div>

                    </div>


                    <!-- Phone -->

                    <label class="form-field">

                        <span>
                            電話
                        </span>

                        <input
                            type="tel"
                            id="restaurantPhone"
                            placeholder="例如：02-1234-5678"
                        >

                    </label>



                    <!-- Address -->

                    <label class="form-field">

                        <span>
                            地址
                        </span>

                        <input
                            type="text"
                            id="restaurantAddress"
                            placeholder="例如：台北市大安區..."
                        >

                    </label>



                    <!-- Hours -->

                    <label class="form-field">

                        <span>
                            營業時間
                        </span>

                        <input
                            type="text"
                            id="restaurantHours"
                            placeholder="例如：11:30 - 21:30"
                        >

                    </label>

                </div>



                <!-- ==================================================
                     Google Maps
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                04
                            </span>

                            <h3>
                                Google Maps
                            </h3>

                        </div>

                    </div>


                    <label class="form-field">

                        <span>
                            Google Maps 網址
                        </span>

                        <input
                            type="url"
                            id="restaurantMaps"
                            placeholder="https://maps.google.com/..."
                        >

                    </label>

                </div>



                <!-- ==================================================
                     Menu Images
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                05
                            </span>

                            <h3>
                                菜單圖片
                            </h3>

                        </div>


                        <span class="form-section-hint">
                            最多 3 張
                        </span>

                    </div>


                    <p class="form-description">

                        菜單是這個系統最重要的功能。
                        請貼上可以直接開啟圖片的網址，
                        輸入後會立即顯示預覽。

                    </p>



                    <!-- Menu 1 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 01
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="1"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview1"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="url"
                            id="restaurantMenu1"
                            placeholder="貼上菜單圖片網址"
                            autocomplete="off"
                        >

                    </div>



                    <!-- Menu 2 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 02
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="2"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview2"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="url"
                            id="restaurantMenu2"
                            placeholder="貼上菜單圖片網址"
                            autocomplete="off"
                        >

                    </div>



                    <!-- Menu 3 -->

                    <div class="menu-form-item">

                        <div class="menu-form-label">

                            <span>
                                菜單 03
                            </span>

                            <button
                                type="button"
                                class="menu-remove-button"
                                data-menu-remove="3"
                            >
                                移除
                            </button>

                        </div>


                        <div
                            class="menu-preview"
                            id="menuPreview3"
                        >

                            <div class="menu-preview-empty">

                                <span>
                                    📖
                                </span>

                                <p>
                                    尚未加入菜單圖片
                                </p>

                            </div>

                        </div>


                        <input
                            type="url"
                            id="restaurantMenu3"
                            placeholder="貼上菜單圖片網址"
                            autocomplete="off"
                        >

                    </div>

                </div>



                <!-- ==================================================
                     Description
                =================================================== -->

                <div class="form-section">

                    <div class="form-section-title">

                        <div>

                            <span class="form-section-number">
                                06
                            </span>

                            <h3>
                                我的備註
                            </h3>

                        </div>

                    </div>


                    <label class="form-field">

                        <span>
                            備註
                        </span>

                        <textarea
                            id="restaurantDescription"
                            rows="4"
                            placeholder="例如：推薦牛肉鍋、適合朋友聚餐..."
                        ></textarea>

                    </label>

                </div>



                <!-- ==================================================
                     Submit
                =================================================== -->

                <button
                    type="submit"
                    class="form-submit-button"
                >

                    儲存餐廳

                </button>


            </form>

        </div>

    </div>



    <!-- ==================================================
         JavaScript
    =================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>  

</body>

</html>
